# CNN-LSTM training config (DESIGN.md §3.3.4, §4).

model_name: cnn_lstm

model_params:
  in_channels: 9
  num_classes: 6
  conv_channels: [64, 128]
  hidden_size: 128
  num_layers: 2
  kernel_size: 3
  dropout: 0.2

data:
  val_ratio: 0.2
  split_seed: 42   # data-split seed; keep fixed across model seeds
  subset_seed: 42  # small-sample subset seed; keep fixed across model seeds

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  lr_factor: 0.5
  lr_patience: 5

seed: 42
