# Transformer comparison config (DESIGN.md §4 附加实验, §7 week 7).
# Same data split, training budget and head as the other models.

model_name: transformer

model_params:
  in_channels: 9
  num_classes: 6
  d_model: 128
  nhead: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.2
  max_len: 128

data:
  val_ratio: 0.2
  split_seed: 42   # data-split seed; keep fixed across model seeds
  subset_seed: 42  # small-sample subset seed; keep fixed across model seeds

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  lr_factor: 0.5
  lr_patience: 5

seed: 42
